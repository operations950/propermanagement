<style>
    .ac-pk { position: relative; display: block; width: 100%; }
    .ac-pk-list { position: absolute; z-index: 1050; left: 0; right: 0; top: 100%; margin-top: 2px; background: #fff; border: 1px solid #cfd6e2; border-radius: 10px; box-shadow: 0 10px 30px rgba(20,30,50,.18); max-height: 260px; overflow-y: auto; min-width: 260px; }
    .ac-pk-list div { padding: 6px 10px; cursor: pointer; font-size: 0.88rem; }
    .ac-pk-list div.on, .ac-pk-list div:hover { background: #e8f0fe; }
    .ac-pk-list .none { color: var(--ink-muted); cursor: default; }
    .ac-pk-list mark { background: #fff3a8; padding: 0; }
</style>
<script>
/* Type words or numbers to narrow a long list of accounts: any select with class ac-pick becomes a search box.
   The select stays underneath (hidden), so forms post exactly as before. */
(function () {
    function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function rx(w) { return w.replace(/[.*+?^$()|\[\]\\{}]/g, '\\$&'); }
    function enhance(sel) {
        if (sel.dataset.acDone) return;
        sel.dataset.acDone = '1';
        var wrap = document.createElement('div');
        wrap.className = 'ac-pk';
        if (sel.style.maxWidth) wrap.style.maxWidth = sel.style.maxWidth;
        sel.parentNode.insertBefore(wrap, sel);
        wrap.appendChild(sel);
        sel.style.display = 'none';
        var input = document.createElement('input');
        input.type = 'text';
        input.autocomplete = 'off';
        input.className = 'form-control' + (sel.classList.contains('form-select-sm') ? ' form-control-sm' : '');
        var first = sel.options.length ? sel.options[0] : null;
        input.placeholder = (first && first.value === '' && first.text) ? first.text : 'Type a name or number';
        var need = sel.required;
        sel.required = false;
        wrap.appendChild(input);
        var list = document.createElement('div');
        list.className = 'ac-pk-list';
        list.hidden = true;
        wrap.appendChild(list);
        var opts = Array.prototype.filter.call(sel.options, function (o) { return o.value !== ''; });
        var hot = -1, shown = [];
        function labelOf() { var o = sel.options[sel.selectedIndex]; return o && o.value !== '' ? o.text : ''; }
        function validity() { input.setCustomValidity(need && sel.value === '' ? 'Pick an account from the list.' : ''); }
        function show() {
            var q = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
            var typing = input.value.trim().toLowerCase() !== labelOf().toLowerCase();
            shown = opts.filter(function (o) {
                var t = o.text.toLowerCase();
                return !typing || q.every(function (w) { return t.indexOf(w) !== -1; });
            }).slice(0, 60);
            hot = shown.length ? 0 : -1;
            list.innerHTML = shown.length ? shown.map(function (o, i) {
                var t = esc(o.text);
                if (typing) q.forEach(function (w) { t = t.replace(new RegExp('(' + rx(esc(w)) + ')', 'ig'), '<mark>$1</mark>'); });
                return '<div data-i="' + i + '" class="' + (i === 0 ? 'on' : '') + '">' + t + '</div>';
            }).join('') : '<div class="none">No account matches. Try fewer letters.</div>';
            list.hidden = false;
        }
        function choose(i) {
            var o = shown[i];
            if (!o) return;
            sel.value = o.value;
            input.value = o.text;
            list.hidden = true;
            validity();
            sel.dispatchEvent(new Event('change', {bubbles: true}));
        }
        function mark() {
            Array.prototype.forEach.call(list.children, function (c, i) { c.classList.toggle('on', i === hot); });
            var c = list.children[hot];
            if (c && c.scrollIntoView) c.scrollIntoView({block: 'nearest'});
        }
        input.value = labelOf();
        input.addEventListener('focus', function () { input.select(); show(); });
        input.addEventListener('input', function () {
            if (sel.value !== '') { sel.value = ''; validity(); }
            show();
        });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) show(); else { hot = Math.min(hot + 1, shown.length - 1); mark(); } }
            else if (e.key === 'ArrowUp') { e.preventDefault(); hot = Math.max(hot - 1, 0); mark(); }
            else if (e.key === 'Enter') { if (!list.hidden && hot >= 0) { e.preventDefault(); choose(hot); } }
            else if (e.key === 'Escape') { list.hidden = true; input.value = labelOf(); }
        });
        list.addEventListener('mousedown', function (e) {
            var d = e.target.closest('div[data-i]');
            if (d) { e.preventDefault(); choose(+d.dataset.i); }
        });
        input.addEventListener('blur', function () {
            if (sel.value === '' && input.value.trim() && shown.length === 1 && !list.hidden) choose(0);
            list.hidden = true;
            input.value = labelOf();
            validity();
        });
        sel.addEventListener('change', function () { input.value = labelOf(); validity(); });
        validity();
    }
    function scan(root) { (root || document).querySelectorAll('select.ac-pick').forEach(enhance); }
    scan();
    new MutationObserver(function (muts) {
        muts.forEach(function (m) {
            m.addedNodes.forEach(function (n) {
                if (n.nodeType !== 1) return;
                if (n.matches && n.matches('select.ac-pick')) enhance(n);
                scan(n);
            });
        });
    }).observe(document.body, {childList: true, subtree: true});
})();
</script>
