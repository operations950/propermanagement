<a class="ac-step" href="{% url 'accounting:close' r.assoc.pk month|date:'Y-m' %}" title="{{ r.detail }}">
    <i data-lucide="building-2" class="icon ac-ico"></i>
    <span class="flex-grow-1" style="min-width: 0;">
        <span class="fw-semibold">{{ r.assoc.name }}</span>
        <span class="ac-bar" role="img" aria-label="{{ r.pct }} percent of the steps are done">{% for sg in r.segments %}<span class="ac-seg {{ sg }}"></span>{% endfor %}</span>
    </span>
    <span class="ac-chip {{ r.status }}">{% if r.status == 'done' %}Closed{% elif r.status == 'attention' %}Needs attention{% else %}Not started{% endif %}</span>
    <i data-lucide="chevron-right" class="icon text-muted"></i>
</a>
