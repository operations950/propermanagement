{# The "Needs attention" card: nudges = core.nudges.collect(user). Nothing here blocks anything; it only points. #}
{% if nudges %}
<div class="card mb-3" style="border-radius: var(--bs-border-radius-lg); border-left: 4px solid {% if nudges.0.level == 'warn' %}var(--status-warning){% else %}var(--brand-primary){% endif %};">
    <div class="card-body py-3">
        <h6 class="card-title d-flex align-items-center gap-2 mb-2"><i data-lucide="bell-ring" class="icon"></i> Needs attention <span class="text-muted fw-normal small">· things only a person can settle</span></h6>
        {% for n in nudges %}
        <a href="{{ n.url }}" class="d-flex justify-content-between align-items-center gap-2 py-2 text-decoration-none {% if not forloop.first %}border-top{% endif %}" style="color: var(--ink-primary);">
            <span class="d-flex align-items-start gap-2" style="min-width: 0;">
                <i data-lucide="{{ n.icon }}" class="icon mt-1" style="color: {% if n.level == 'warn' %}#b07a00{% else %}var(--ink-muted){% endif %};"></i>
                <span><span class="fw-medium">{{ n.text }}</span>{% if n.detail %}<span class="d-block small text-muted">{{ n.detail }}</span>{% endif %}</span>
            </span>
            <span class="badge rounded-pill flex-shrink-0" style="{% if n.level == 'warn' %}background: color-mix(in srgb, var(--status-warning) 25%, white); color: #7a5200; border: 1px solid var(--status-warning);{% else %}background: var(--bs-light, #f1f3f5); color: var(--ink-secondary); border: 1px solid var(--border-hairline);{% endif %}">{{ n.count }} <i data-lucide="arrow-right" class="icon"></i></span>
        </a>
        {% endfor %}
    </div>
</div>
{% endif %}
