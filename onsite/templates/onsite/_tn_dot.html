{# The cleaning behind one check-out: click to schedule it or put a cleaner on it. Needs: e (the check-out event), r (the row), cls (the classes). Inside the button: the content block's text, or the dot's icon. #}
<button type="button" class="{{ cls }}" data-wk-clean data-booking="{{ e.booking.pk }}" data-state="{{ e.cleaning.code }}" data-text="{{ e.cleaning.text }}" data-visit="{{ e.cleaning.visit }}" data-who="{{ e.cleaning.who }}" data-label="{{ r.label }}" data-out="{{ e.normal }}" title="{{ e.cleaning.label }}{% if e.cleaning.who %}: {{ e.cleaning.who }}{% endif %}">{% if badge %}{{ e.cleaning.badge }}{% else %}<i data-lucide="{% if e.cleaning.mark == 'none' %}x{% else %}sparkles{% endif %}" class="icon"></i>{% endif %}</button>
