{# One check-out or check-in time you can click to change. Needs: e (the event), r (the row, for its label), cls (the classes), word (OUT / IN or out / in). #}
<button type="button" class="{{ cls }} {{ e.state }}" data-wk-time data-booking="{{ e.booking.pk }}" data-kind="{{ e.kind }}" data-value="{{ e.value }}" data-min="{{ e.minutes }}" data-normal="{{ e.normal }}" data-normalmin="{{ e.normal_minutes }}" data-other="{{ e.other }}" data-est="{{ e.est }}" data-buffer="{{ e.buffer }}" data-has="{% if e.req %}1{% endif %}" data-label="{{ r.label }}"
        title="{% if e.kind == 'checkout' %}Checks out{% else %}Checks in{% endif %} at {{ e.long }}{% if e.state == 'pending' %} (change waiting for a yes; normally {{ e.normal }}){% elif e.state == 'approved' %} (change agreed; normally {{ e.normal }}){% endif %}. Click to change the time."><span>{{ word }} {{ e.time }}</span>{% if e.state == 'pending' %}<span class="m">!</span>{% elif e.state == 'approved' %}<span class="m">&#10003;</span>{% endif %}</button>
