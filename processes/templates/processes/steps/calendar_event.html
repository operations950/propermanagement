{% if step.response.event_datetime %}
<div class="small">
    <div>{{ step.response.event_datetime }}</div>
    {% if step.response.meeting_link %}<a href="{{ step.response.meeting_link }}" target="_blank" rel="noopener">Join Google Meet</a>{% endif %}
</div>
{% else %}
<form method="post" action="{% url 'process_run_step_schedule_event' step.pk %}" class="d-flex align-items-center gap-2">
    {% csrf_token %}
    <input type="datetime-local" name="event_datetime" class="form-control form-control-sm" style="max-width: 220px;" required>
    <button type="submit" class="btn btn-sm btn-outline-primary">Schedule</button>
</form>
{% endif %}
