{% load process_extras %}
{% run_meeting_prefill step as pre %}
<form method="post" action="{% url 'process_run_step_meeting' step.pk %}" class="row g-2 align-items-end">
    {% csrf_token %}
    <div class="col-md-3"><label class="form-label small mb-0">Date</label><input type="date" name="date" class="form-control form-control-sm" required></div>
    <div class="col-md-2"><label class="form-label small mb-0">Time</label><input type="text" name="time" class="form-control form-control-sm" placeholder="6:00 p.m." maxlength="40" required></div>
    <div class="col-md-4"><label class="form-label small mb-0">Place</label><input type="text" name="place" class="form-control form-control-sm" maxlength="300" value="{{ pre.place }}" required></div>
    <div class="col-md-3"><label class="form-label small mb-0">Video link (optional)</label><input type="text" name="video_link" class="form-control form-control-sm" maxlength="300"></div>
    <div class="col-12"><button type="submit" class="btn btn-sm btn-outline-primary">Save meeting details</button></div>
</form>
