{% extends 'base.html' %}
{% block title %}No access{% endblock %}
{% block content %}
<div class="mx-auto text-center" style="max-width: 460px; padding: 3rem 0.5rem;">
    <div class="display-6 fw-semibold mb-2" style="color: var(--brand-slate);">403</div>
    <h1 class="h4 page-title mb-2">You don't have access to this page</h1>
    <p class="text-muted mb-4">You don't have permission to open it. If you think you should, ask an administrator.</p>
    <div class="d-grid gap-2">
        <a class="btn btn-primary btn-lg" href="/">Go to the home screen</a>
        <button type="button" class="btn btn-outline-secondary btn-lg" onclick="if (history.length > 1) { history.back(); } else { location.href = '/'; }">Go back</button>
    </div>
</div>
{% endblock %}
