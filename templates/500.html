<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong</title>
<style>
    body { margin: 0; background: #f4f3f7; color: #2b2b2e; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 460px; margin: 0 auto; padding: 4rem 1.25rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #5b5b63; margin: 0 0 1.75rem; }
    a, button { display: block; width: 100%; box-sizing: border-box; min-height: 52px; margin-bottom: 0.6rem; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid #6f92ad; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    a { background: #6f92ad; color: #fff; }
    button { background: #fff; color: #3f6785; }
</style>
</head>
<body>
<main>
    <h1>Something went wrong on our side</h1>
    <p>Nothing you did caused this. Please try again in a moment; if it keeps happening, tell an administrator what you were doing.</p>
    <a href="/">Go to the home screen</a>
    <button type="button" onclick="location.reload()">Try this page again</button>
</main>
</body>
</html>
