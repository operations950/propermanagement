<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>You are offline — Proper Realty</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; align-items: center; justify-content: center; background: #efedf3; color: #2b2b2e; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
        .card { max-width: 22rem; }
        .mark { width: 64px; height: 64px; border-radius: 16px; background: {{ accent }}; color: #fff; font: 600 38px/64px Georgia, 'Times New Roman', serif; margin: 0 auto 1.1rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .4rem; }
        p { color: #6b7280; margin: 0 0 1.2rem; line-height: 1.45; }
        button { background: {{ accent }}; color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.2rem; font-size: 1rem; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">P</div>
        <h1>You are offline</h1>
        <p>Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
