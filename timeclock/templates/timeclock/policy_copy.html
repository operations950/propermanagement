<!doctype html><html lang="en"><head><meta charset="utf-8"><title>{{ title }} — signed copy</title>
<style>body{font:15px/1.5 system-ui,Segoe UI,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222}h1{font-family:Georgia,serif}h3{margin:1.2rem 0 .4rem}.tc-table{border-collapse:collapse;width:100%}.tc-table td,.tc-table th{border-bottom:1px solid #ddd;padding:.3rem;text-align:left}.sig{border:2px solid #333;padding:1rem;margin-top:2rem}</style></head><body>
<h1>{{ title }}</h1>
{{ sig.text|safe }}
<div class="sig"><strong>Signed by:</strong> {{ sig.typed_name }}<br><strong>Employee:</strong> {{ profile.name }}<br><strong>Date and time:</strong> {{ sig.signed_at|date:"F j, Y" }} at {{ sig.signed_at|time:"g:i A" }}<br><strong>Policy version:</strong> {{ sig.version }}</div>
</body></html>
