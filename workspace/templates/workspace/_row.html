<a class="ws-row k-{{ r.kind }}" href="{{ r.url }}"><span class="where">{{ r.where }}</span><span class="main"><b>{{ r.title }}</b><small>{% if r.where %}<span class="d-md-none">{{ r.where }} &middot; </span>{% endif %}{{ r.note }}</small></span><span class="due{% if r.late %} late{% endif %}">{{ r.due }}{% if r.pushes %} <small title="Pushed {{ r.pushes }} time{{ r.pushes|pluralize }}">&#8635;{{ r.pushes }}</small>{% endif %}</span><span class="go">&rsaquo;</span></a>
